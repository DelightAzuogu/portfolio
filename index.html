<!doctype html>
<html lang="en" class="bg-bg motion-safe:scroll-smooth lg:scroll-pt-11">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delight Ikechukwu Azuogu</title>
    <meta
      name="description"
      content="Software developer building across mobile, web and backend with Flutter, React, NestJS and ASP.NET."
    />
    <script>
      // Runs before first paint so a saved or system light theme never flashes dark.
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body class="bg-bg text-[14px]/[1.6] text-fg lg:text-[15px]/[1.6]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
